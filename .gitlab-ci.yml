variables:
  HARBOR_IMAGE: registry.hanada.info/hanada/dnsmgr-frontend
  DOCKER_BUILDKIT: "1"

stages:
  - verify
  - build
  - manifest

.verify-job:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - |
      set -eu

      APP_VERSION="$(tr -d '[:space:]' < VERSION)"
      APP_VERSION="${APP_VERSION#v}"

      if [ -z "$APP_VERSION" ]; then
        echo "VERSION file is empty" >&2
        exit 1
      fi

      VERSION="${APP_VERSION}"
      export APP_VERSION VERSION
      echo "Verifying dnsmgr-frontend ${VERSION}"

.docker-job:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "ext"'
  before_script:
    - |
      set -eu

      APP_VERSION="$(tr -d '[:space:]' < VERSION)"
      APP_VERSION="${APP_VERSION#v}"

      if [ -z "$APP_VERSION" ]; then
        echo "VERSION file is empty" >&2
        exit 1
      fi

      VERSION="${APP_VERSION}"
      export APP_VERSION VERSION
      echo "Building dnsmgr-frontend ${VERSION}"
    - |
      printf '%s' "$HARBOR_PASSWORD" | docker login registry.hanada.info --username "$HARBOR_USERNAME" --password-stdin

verify:
  extends: .verify-job
  stage: verify
  tags:
    - debian-x86_64
  script:
    - |
      docker build \
        --pull \
        --build-arg APP_VERSION="${VERSION}" \
        --tag "dnsmgr-frontend:verify-${CI_COMMIT_SHORT_SHA}" \
        .
    - |
      container_name="dnsmgr-frontend-verify-${CI_JOB_ID}"

      docker run --detach \
        --name "$container_name" \
        --read-only \
        --tmpfs /tmp:rw,noexec,nosuid,size=16m \
        --cap-drop ALL \
        --security-opt no-new-privileges:true \
        "dnsmgr-frontend:verify-${CI_COMMIT_SHORT_SHA}"

      healthy=0
      for attempt in $(seq 1 10); do
        if docker exec "$container_name" \
          wget -q -O /dev/null http://127.0.0.1:8080/healthz; then
          healthy=1
          break
        fi
        sleep 1
      done

      if [ "$healthy" -ne 1 ]; then
        docker logs "$container_name"
        exit 1
      fi

      docker exec "$container_name" /usr/sbin/nginx -T 2>&1 \
        | grep -Eq '^worker_processes[[:space:]]+1;'
  after_script:
    - docker rm -f "dnsmgr-frontend-verify-${CI_JOB_ID}" || true
    - docker image rm "dnsmgr-frontend:verify-${CI_COMMIT_SHORT_SHA}" || true

build-amd64:
  extends: .docker-job
  stage: build
  tags:
    - debian-x86_64
  script:
    - |
      docker build \
        --pull \
        --build-arg APP_VERSION="${VERSION}" \
        --tag "${HARBOR_IMAGE}:${VERSION}-amd64" \
        .

      docker push "${HARBOR_IMAGE}:${VERSION}-amd64"

build-arm64:
  extends: .docker-job
  stage: build
  tags:
    - debian-aarch64
  script:
    - |
      docker build \
        --pull \
        --build-arg APP_VERSION="${VERSION}" \
        --tag "${HARBOR_IMAGE}:${VERSION}-arm64" \
        .

      docker push "${HARBOR_IMAGE}:${VERSION}-arm64"

create-manifest:
  extends: .docker-job
  stage: manifest
  tags:
    - debian-x86_64
  needs:
    - build-amd64
    - build-arm64
  script:
    - |
      docker manifest inspect "${HARBOR_IMAGE}:${VERSION}-amd64"
      docker manifest inspect "${HARBOR_IMAGE}:${VERSION}-arm64"

      docker manifest create --amend "${HARBOR_IMAGE}:${VERSION}" \
        --amend "${HARBOR_IMAGE}:${VERSION}-amd64" \
        --amend "${HARBOR_IMAGE}:${VERSION}-arm64"
      docker manifest push --purge "${HARBOR_IMAGE}:${VERSION}"

      docker manifest create --amend "${HARBOR_IMAGE}:latest" \
        --amend "${HARBOR_IMAGE}:${VERSION}-amd64" \
        --amend "${HARBOR_IMAGE}:${VERSION}-arm64"
      docker manifest push --purge "${HARBOR_IMAGE}:latest"
